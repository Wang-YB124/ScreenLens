<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e131a;
      color: #eef5ff;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      overflow: hidden;
    }
    .inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .word {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f6faff;
    }
    .hint {
      font-size: 14px;
      color: #7c8b9d;
    }
  </style>
</head>
<body>
  <div class="inner">
    <div class="word">serendipity</div>
    <div class="hint">Dictionary fallback test</div>
  </div>
</body>
</html>
