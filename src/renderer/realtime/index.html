<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" />
  <title>ScreenLens 实时字幕</title>
  <link rel="stylesheet" href="../common/base.css" />
  <link rel="stylesheet" href="../vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="./realtime.css" />
</head>
<body>
  <div class="wrap">
    <div class="sub" id="sub">
      <div class="meta">
        <span class="grip" id="grip" title="按住拖动字幕">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="live"><i></i>实时</span>
        <span class="scope hidden" id="scope"></span>
        <span class="dir" id="dir"></span>
        <span class="provider" id="provider"></span>
        <span class="hint" id="hint">再次按下快捷键停止</span>
        <span class="ctrls">
          <button type="button" class="rt-btn hidden" id="btn-auto-size" title="恢复自动大小（也可双击右下角缩放把手）">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 8a5 5 0 1 1-1.46-3.54"></path>
              <path d="M13 2.5V5h-2.5"></path>
            </svg>
          </button>
          <button type="button" class="rt-btn explain-btn" id="btn-explain" title="AI 解释当前字幕" aria-label="AI 解释当前字幕">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 1.6 9.35 6.65 14.4 8 9.35 9.35 8 14.4 6.65 9.35 1.6 8 6.65 6.65Z"></path>
            </svg>
            <span>解释</span>
          </button>
          <button type="button" class="rt-btn hidden" id="btn-record" title="打开最近的音频记录" aria-label="音频记录">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 2.5h6l3 3v8H3Z"></path>
              <path d="M9 2.5v3h3"></path>
            </svg>
          </button>
          <button type="button" class="rt-btn" id="btn-settings" title="字幕设置" aria-label="字幕设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
            </svg>
          </button>
          <button type="button" class="rt-btn rt-close" id="btn-close" title="关闭字幕" aria-label="关闭字幕">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"></path>
            </svg>
          </button>
        </span>
      </div>
      <div class="original" id="original"></div>
      <div class="translated" id="translated">
        <span class="waiting-dot"></span>
        将选区对准字幕或文字区域
      </div>
      <div class="explain" id="explain" hidden>
        <div class="explain-head">
          <span class="explain-tag">AI 解释</span>
          <span class="explain-state" id="explain-state"></span>
          <button type="button" class="explain-close" id="explain-close" title="关闭解释" aria-label="关闭解释">×</button>
        </div>
        <div class="explain-body" id="explain-body" aria-live="polite"></div>
      </div>
      <div class="panel" id="panel" hidden>
        <div class="panel-row">
          <span class="p-label">字号</span>
          <div class="stepper">
            <button type="button" class="step-btn" id="font-down" aria-label="减小字号">A−</button>
            <span class="p-value" id="font-value">20</span>
            <button type="button" class="step-btn" id="font-up" aria-label="增大字号">A+</button>
          </div>
          <span class="p-label p-label-mid">背景</span>
          <input class="p-range" id="opacity-range" type="range" min="35" max="100" step="1" value="92" aria-label="字幕背景不透明度" />
          <span class="p-value" id="opacity-value">92%</span>
        </div>
        <div class="panel-row lang-row">
          <span class="p-label">原文</span>
          <div class="chips" id="source-chips"></div>
        </div>
        <div class="panel-row lang-row">
          <span class="p-label">译为</span>
          <div class="chips" id="target-chips"></div>
        </div>
        <div class="preview">
          <span class="preview-tag">预览</span>
          <span class="preview-text" id="preview-text">字幕效果预览</span>
        </div>
        <div class="panel-foot">
          <span>按住字幕顶部任意位置可移动 · 设置自动保存</span>
          <button type="button" class="panel-reset" id="reset-size">恢复自动大小</button>
        </div>
      </div>
      <span class="resize-grip" id="resize-grip" title="拖动调整字幕框大小，双击恢复自动大小">
        <svg viewBox="0 0 16 16"><path d="M14 6L6 14M14 10L10 14M14 2L2 14"></path></svg>
      </span>
    </div>
  </div>
  <script src="../vendor/katex/katex.min.js"></script>
  <script src="./realtime.js"></script>
</body>
</html>
